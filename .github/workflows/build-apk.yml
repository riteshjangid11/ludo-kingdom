name: Build Signed Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install Capacitor packages
        run: npm install

      - name: Add Android platform
        run: npx cap add android

      - name: Generate app icon and splash screen
        run: |
          sudo apt-get update
          sudo apt-get install -y librsvg2-bin
          mkdir -p assets
          rsvg-convert -w 1024 -h 1024 www/icon.svg -o assets/logo.png
          npx @capacitor/assets generate --android

      - name: Sync web files to Android
        run: npx cap sync android

      - name: Build release APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Sign release APK
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | tr -d '[:space:]' | base64 -d > release.keystore
          BUILD_TOOLS=$(ls -d ${ANDROID_HOME:-/usr/local/lib/android/sdk}/build-tools/* | sort -V | tail -n 1)
          UNSIGNED_APK=$(ls android/app/build/outputs/apk/release/*.apk | head -n 1)
          "$BUILD_TOOLS/zipalign" -f -p 4 "$UNSIGNED_APK" aligned.apk
          "$BUILD_TOOLS/apksigner" sign \
            --ks release.keystore \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass "pass:$KEYSTORE_PASSWORD" \
            --key-pass "pass:$KEY_PASSWORD" \
            --out LudoKingdom-release.apk \
            aligned.apk
          "$BUILD_TOOLS/apksigner" verify LudoKingdom-release.apk
          rm -f release.keystore aligned.apk

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: LudoKingdom-APK
          path: LudoKingdom-release.apk
